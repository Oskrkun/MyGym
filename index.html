<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiGym App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>MiGym</h1>
  </header>

  <main class="container">
    <!-- PESTAÑA: ENTRENAMIENTO -->
    <section id="workoutTab" class="tab-content">
      <div style="margin-bottom: 1rem;">
        <label for="routineSelect">Seleccionar Rutina:</label>
        <select id="routineSelect" style="width: 100%; padding: 0.5rem; margin-top: 0.4rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px;"></select>
      </div>

      <div id="workoutContainer"></div>
    </section>

    <!-- PESTAÑA: PROGRESO -->
    <section id="progressTab" class="tab-content" style="display: none;">
      <h2>Tu Progreso</h2>
      <p id="streakCounter" style="margin-top: 0.5rem; color: var(--accent); font-weight: bold;"></p>
      <div id="heatmapContainer" class="heatmap-grid"></div>
    </section>

    <!-- PESTAÑA: AJUSTES / ADMIN -->
    <section id="adminTab" class="tab-content" style="display: none;">
      <h2>Configuración</h2>
      
      <div class="card" style="margin-top: 1rem;">
        <h3>Tiempo de Descanso</h3>
        <label for="restSecondsInput">Segundos entre series:</label>
        <input type="number" id="restSecondsInput" class="set-input" style="width: 100%; margin-top: 0.5rem;" min="10" max="300">
      </div>

      <div class="card">
        <h3>Rutinas</h3>
        <div id="adminRoutinesContainer"></div>
      </div>

      <div class="card">
        <h3>Respaldo de Datos</h3>
        <button id="exportJsonBtn" class="btn" style="margin-bottom: 0.5rem;">Exportar Datos (JSON)</button>
        <label for="importJsonInput" class="btn" style="display: block; text-align: center; background: var(--surface-hover);">Importar Datos (JSON)</label>
        <input type="file" id="importJsonInput" accept=".json" style="display: none;">
      </div>
    </section>
  </main>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="nav-tabs">
    <button class="tab-btn active" data-tab="workoutTab">🏋️ Entrenamiento</button>
    <button class="tab-btn" data-tab="progressTab">📊 Progreso</button>
    <button class="tab-btn" data-tab="adminTab">⚙️ Ajustes</button>
  </nav>

  <!-- OVERLAY DEL TEMPORIZADOR -->
  <div id="timerOverlay" class="overlay">
    <div class="modal-content" style="text-align: center;">
      <h3>Descanso</h3>
      <div id="timerDisplay" style="font-size: 3rem; font-weight: bold; margin: 1rem 0;">60s</div>
      <button id="stopTimerBtn" class="btn" style="background: var(--danger);">Omitir</button>
    </div>
  </div>

  <!-- MODAL HISTORIAL -->
  <div id="historyModal" class="overlay">
    <div class="modal-content">
      <div id="historyModalBody"></div>
      <button class="btn" style="margin-top: 1rem;" onclick="document.getElementById('historyModal').style.display='none'">Cerrar</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
